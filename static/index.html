<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟女友</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ==================== 侧边栏 ==================== -->
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="logo">💕 虚拟女友</div>
  </div>

  <div class="sidebar-section">
    <div class="section-title">选择角色</div>
    <ul id="character-list"></ul>
    <button class="btn btn-sm btn-outline" id="btn-new-character" style="width:100%;margin-top:8px;">+ 创建新角色</button>
  </div>

  <div class="sidebar-section">
    <div class="section-title">快捷操作</div>
    <button class="btn btn-sm btn-outline sidebar-btn" id="btn-open-gallery">🖼️ AI 绘画</button>
    <button class="btn btn-sm btn-outline sidebar-btn" id="btn-open-memories">🧠 记忆管理</button>
  </div>

  <div class="sidebar-footer">
    <button class="btn btn-sm btn-ghost sidebar-btn" id="btn-open-settings">⚙️ 设置</button>
  </div>
</aside>

<!-- ==================== 主聊天区 ==================== -->
<main id="main-panel">
  <!-- 顶部栏 -->
  <header id="chat-header">
    <button class="btn-icon" id="btn-toggle-sidebar">☰</button>
    <div class="header-avatar" id="header-avatar"></div>
    <div class="header-info">
      <div class="header-name" id="header-name">小暖</div>
      <div class="header-desc" id="header-desc">温柔可爱的女朋友</div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-voice-toggle" title="语音播报">🔊</button>
      <button class="btn-icon" id="btn-clear-chat" title="清空聊天">🗑️</button>
    </div>
  </header>

  <!-- 消息区域 -->
  <div id="chat-messages">
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-avatar" id="welcome-avatar"></div>
      <h2 id="welcome-name">小暖</h2>
      <p id="welcome-desc">温柔可爱的女朋友</p>
      <p class="welcome-hint">发一条消息开始聊天吧~ 💕</p>
    </div>
  </div>

  <!-- 输入区域 -->
  <div id="chat-input-area">
    <div class="input-row">
      <button class="btn-icon" id="btn-upload-image" title="发送图片">🖼️</button>
      <textarea id="message-input" rows="1" placeholder="输入消息..." maxlength="2000"></textarea>
      <button class="btn-icon btn-send" id="btn-send" title="发送">➤</button>
    </div>
    <div class="input-hint">Enter 发送 | Shift+Enter 换行</div>
    <input type="file" id="image-upload" accept="image/*" style="display:none">
    <div id="image-preview-container" style="display:none">
      <div class="image-preview">
        <img id="image-preview-img" src="" alt="预览">
        <button class="btn-remove-image" id="btn-remove-image">✕</button>
      </div>
    </div>
  </div>
</main>

<!-- ==================== 设置弹窗 ==================== -->
<div class="modal" id="modal-settings">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>⚙️ 设置</h3>
      <button class="btn-close" data-close="modal-settings">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="setting-api-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label>Base URL</label>
        <input type="text" id="setting-base-url" placeholder="https://api.deepseek.com">
      </div>
      <div class="form-group">
        <label>模型名称</label>
        <input type="text" id="setting-model" placeholder="deepseek-chat">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>最大 Token</label>
          <input type="number" id="setting-max-token" value="2000">
        </div>
        <div class="form-group">
          <label>温度</label>
          <input type="number" id="setting-temperature" value="0.9" step="0.1" min="0" max="2">
        </div>
      </div>
      <div class="form-group">
        <label>TTS 语音</label>
        <select id="setting-tts-voice">
          <option value="zh-CN-XiaoxiaoNeural">晓晓 (温柔女声)</option>
          <option value="zh-CN-XiaoyiNeural">晓怡 (活泼女声)</option>
          <option value="zh-CN-YunxiNeural">云希 (男声)</option>
          <option value="zh-CN-YunyangNeural">云扬 (男声)</option>
          <option value="zh-CN-XiaochenNeural">晓辰 (女声)</option>
        </select>
      </div>
      <details style="margin-top:12px;">
        <summary style="cursor:pointer;color:#888;font-size:13px;">绘画 API 设置</summary>
        <div class="form-group" style="margin-top:8px;">
          <label>绘画 API Key</label>
          <input type="password" id="setting-painting-api-key" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label>绘画 Base URL</label>
          <input type="text" id="setting-painting-base-url" placeholder="https://api.siliconflow.cn/v1/">
        </div>
        <div class="form-group">
          <label>绘画模型</label>
          <input type="text" id="setting-painting-model" placeholder="black-forest-labs/FLUX.1-schnell">
        </div>
      </details>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="modal-settings">取消</button>
      <button class="btn btn-primary" id="btn-save-settings">保存设置</button>
    </div>
  </div>
</div>

<!-- ==================== 角色编辑弹窗 ==================== -->
<div class="modal" id="modal-character">
  <div class="modal-backdrop"></div>
  <div class="modal-content modal-lg">
    <div class="modal-header">
      <h3 id="modal-char-title">创建角色</h3>
      <button class="btn-close" data-close="modal-character">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>角色名</label>
        <input type="text" id="char-name" placeholder="给角色起个名字">
      </div>
      <div class="form-group">
        <label>一句话描述</label>
        <input type="text" id="char-desc" placeholder="简短的描述，如：温柔可爱的女朋友">
      </div>
      <div class="form-group">
        <label>角色设定 (System Prompt)</label>
        <textarea id="char-prompt" rows="14" placeholder="填写详细的角色设定..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="modal-character">取消</button>
      <button class="btn btn-danger" id="btn-delete-character" style="display:none;">删除角色</button>
      <button class="btn btn-primary" id="btn-save-character">保存角色</button>
    </div>
  </div>
</div>

<!-- ==================== AI 绘画弹窗 ==================== -->
<div class="modal" id="modal-painting">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>🖼️ AI 绘画</h3>
      <button class="btn-close" data-close="modal-painting">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>图片描述 (Prompt)</label>
        <textarea id="painting-prompt" rows="3" placeholder="描述你想要的画面..."></textarea>
      </div>
      <div id="painting-result" style="display:none;">
        <img id="painting-img" src="" alt="AI 生成图片" style="width:100%;border-radius:12px;margin-top:8px;">
        <button class="btn btn-sm btn-outline" id="btn-download-painting" style="width:100%;margin-top:8px;">💾 保存图片</button>
      </div>
      <div id="painting-loading" style="display:none;text-align:center;padding:24px;">
        <div class="spinner"></div>
        <p style="color:#888;margin-top:8px;">AI 正在创作中...</p>
      </div>
      <div id="painting-error" style="display:none;color:#e74c3c;text-align:center;padding:12px;"></div>
      <div class="painting-history" id="painting-history"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="modal-painting">关闭</button>
      <button class="btn btn-primary" id="btn-generate-painting">生成图片</button>
    </div>
  </div>
</div>

<!-- ==================== 记忆管理弹窗 ==================== -->
<div class="modal" id="modal-memories">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>🧠 记忆管理</h3>
      <button class="btn-close" data-close="modal-memories">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>添加新的记忆</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="memory-input" placeholder="记录一条关于当前角色的重要信息...">
          <button class="btn btn-primary btn-sm" id="btn-add-memory">添加</button>
        </div>
      </div>
      <div id="memories-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="modal-memories">关闭</button>
    </div>
  </div>
</div>

<!-- ==================== 音频播放器(隐藏) ==================== -->
<audio id="audio-player" style="display:none;"></audio>

<!-- Socket.IO & 应用脚本 -->
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
